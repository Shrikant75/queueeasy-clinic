<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner PWA</title>
  
  <!-- Web Manifest Data URI (Makes it installable without a separate file) -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"QR Scanner PWA","short_name":"QR Scanner","start_url":".","display":"standalone","background_color":"#121212","theme_color":"#007bff","icons":[{"src":"https://flaticon.com","sizes":"512x512","type":"image/png"}]}' />
  <meta name="theme-color" content="#007bff">

  <!-- Core Styles -->
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #scanner-container {
      position: relative;
      width: 90%;
      max-width: 500px;
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      background: #1e1e1e;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #scan-region-visual {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-translate(-50%, -50%));
      width: 60%;
      height: 60%;
      border: 4px solid #007bff;
      border-radius: 12px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      box-sizing: border-box;
    }
    #result-panel {
      width: 90%;
      max-width: 500px;
      margin-top: 20px;
      padding: 16px;
      background: #1e1e1e;
      border-radius: 12px;
      box-sizing: border-box;
      text-align: center;
      word-break: break-all;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
    }
    button:active { background: #0056b3; }
  </style>

  <!-- HTML5-QRCode Library for rapid decoding -->
  <script src="https://unpkg.com" type="text/javascript"></script>
</head>
<body>

  <div id="scanner-container">
    <div id="reader"></div>
    <div id="scan-region-visual"></div>
  </div>

  <div id="result-panel">
    <p id="status-text">Ready to scan. Grant camera permissions if prompted.</p>
    <div id="result-action" style="display: none;">
      <p id="result-text" style="font-weight: bold; color: #00ff88;"></p>
      <button onclick="copyToClipboard()">Copy Result</button>
      <button onclick="restartScanner()" style="background: #333; margin-left: 8px;">Scan Again</button>
    </div>
  </div>

  <script>
    let html5QrCode;
    const config = { fps: 10, qrbox: (width, height) => { return { width: width * 0.6, height: height * 0.6 } } };

    async function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      try {
        await html5QrCode.start(
          { facingMode: "environment" }, 
          config,
          (decodedText) => {
            // Success Callback
            html5QrCode.stop();
            document.getElementById("status-text").style.display = "none";
            document.getElementById("result-action").style.display = "block";
            document.getElementById("result-text").innerText = decodedText;
            
            // Auto-open URL if valid
            if(decodedText.startsWith("http://") || decodedText.startsWith("https://")) {
              setTimeout(() => { if(confirm("Open link: " + decodedText)) window.open(decodedText, '_blank'); }, 500);
            }
          },
          (errorMessage) => { /* Verbose parsing errors ignored silently */ }
        );
      } catch (err) {
        document.getElementById("status-text").innerText = "Camera access denied or unavailable.";
      }
    }

    function restartScanner() {
      document.getElementById("status-text").style.display = "block";
      document.getElementById("status-text").innerText = "Scanning...";
      document.getElementById("result-action").style.display = "none";
      startScanner();
    }

    function copyToClipboard() {
      const text = document.getElementById("result-text").innerText;
      navigator.clipboard.writeText(text);
      alert("Copied to clipboard!");
    }

    // Initialize on load
    window.addEventListener('DOMContentLoaded', startScanner);

    // Register Service Worker for Offline Capabilities
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'qr-pwa-v1';
        const ASSETS = [
          './',
          './index.html',
          'https://unpkg.com'
        ];
        self.addEventListener('install', e => {
          e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(ASSETS)));
        });
        self.addEventListener('fetch', e => {
          e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob));
    }
  </script>
</body>
</html>
