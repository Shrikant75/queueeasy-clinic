<main class="container">

    <section id="tokenSection" class="token-section">

        <p class="token-label">YOUR TOKEN</p>

        <div class="token-circle">
            <span id="tokenNumber">Q-03</span>
        </div>

        <h2>You're in the queue</h2>

        <p class="token-subtitle">
            We'll notify you when your turn is approaching.
        </p>

        <button
            id="notificationButton"
            class="notification-button"
            onclick="enableNotifications()">

            <span>🔔</span>
            <span>Enable Notification</span>

        </button>

        <button
            class="leave-button"
            onclick="leaveQueue()">

            Leave Queue

        </button>

    </section>

</main>
